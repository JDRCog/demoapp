name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        iso20022: ["false", "true"]
    name: verify (iso20022=${{ matrix.iso20022 }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, test, coverage gate
        run: mvn -B clean verify -Dcrossborder.iso20022.enabled=${{ matrix.iso20022 }}
